<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a2e"/>

  <!-- Node boxes -->
  <!-- Query -->
  <rect x="30" y="210" width="110" height="60" rx="10" fill="#667eea"/>
  <text x="85" y="236" fill="white" font-size="13" font-weight="700" text-anchor="middle">User Query</text>
  <text x="85" y="254" fill="#c8d4ff" font-size="10" text-anchor="middle">natural language</text>

  <!-- Arrow -->
  <line x1="140" y1="240" x2="166" y2="240" stroke="#667eea" stroke-width="2"/>
  <polygon points="166,234 178,240 166,246" fill="#667eea"/>

  <!-- Multi-Query -->
  <rect x="178" y="210" width="130" height="60" rx="10" fill="#764ba2"/>
  <text x="243" y="236" fill="white" font-size="13" font-weight="700" text-anchor="middle">Multi-Query</text>
  <text x="243" y="254" fill="#e0c8ff" font-size="10" text-anchor="middle">5 query variants</text>

  <!-- Arrow -->
  <line x1="308" y1="240" x2="334" y2="240" stroke="#764ba2" stroke-width="2"/>
  <polygon points="334,234 346,240 334,246" fill="#764ba2"/>

  <!-- FAISS -->
  <rect x="346" y="210" width="130" height="60" rx="10" fill="#4c63b6"/>
  <text x="411" y="236" fill="white" font-size="13" font-weight="700" text-anchor="middle">FAISS Search</text>
  <text x="411" y="254" fill="#b0c0ff" font-size="10" text-anchor="middle">cosine similarity</text>

  <!-- Arrow -->
  <line x1="476" y1="240" x2="502" y2="240" stroke="#4c63b6" stroke-width="2"/>
  <polygon points="502,234 514,240 502,246" fill="#4c63b6"/>

  <!-- Compression -->
  <rect x="514" y="210" width="140" height="60" rx="10" fill="#2d3a8c"/>
  <text x="584" y="236" fill="white" font-size="13" font-weight="700" text-anchor="middle">Compression</text>
  <text x="584" y="254" fill="#a0b0ff" font-size="10" text-anchor="middle">filter irrelevant</text>

  <!-- Arrow -->
  <line x1="654" y1="240" x2="680" y2="240" stroke="#2d3a8c" stroke-width="2"/>
  <polygon points="680,234 692,240 680,246" fill="#2d3a8c"/>

  <!-- RAG Chain -->
  <rect x="692" y="210" width="130" height="60" rx="10" fill="#1a237e"/>
  <text x="757" y="236" fill="white" font-size="13" font-weight="700" text-anchor="middle">RAG Chain</text>
  <text x="757" y="254" fill="#90a0ff" font-size="10" text-anchor="middle">grounded answer</text>

  <!-- Down arrow from RAG Chain -->
  <line x1="757" y1="270" x2="757" y2="310" stroke="#90a0ff" stroke-width="2"/>
  <polygon points="751,310 757,322 763,310" fill="#90a0ff"/>

  <!-- Response box -->
  <rect x="630" y="326" width="260" height="60" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="352" fill="#58d68d" font-size="12" font-weight="600" text-anchor="middle">Answer + Sources</text>
  <text x="760" y="370" fill="#888" font-size="10" text-anchor="middle">grounded, cited response</text>

  <!-- LLM label (floating below multi-query + RAG) -->
  <rect x="195" y="295" width="110" height="28" rx="6" fill="#2d1f4e" stroke="#764ba2" stroke-width="1"/>
  <text x="250" y="313" fill="#d0b0ff" font-size="10" text-anchor="middle">LLM (query gen)</text>
  <line x1="243" y1="270" x2="243" y2="295" stroke="#764ba2" stroke-width="1" stroke-dasharray="4 2"/>

  <rect x="700" y="295" width="110" height="28" rx="6" fill="#1a1f4e" stroke="#4c63b6" stroke-width="1"/>
  <text x="755" y="313" fill="#a0b8ff" font-size="10" text-anchor="middle">LLM (answer gen)</text>

  <!-- FAISS index label -->
  <rect x="346" y="295" width="130" height="28" rx="6" fill="#1a2540" stroke="#4c63b6" stroke-width="1"/>
  <text x="411" y="313" fill="#80a0e0" font-size="10" text-anchor="middle">FAISS index on disk</text>
  <line x1="411" y1="270" x2="411" y2="295" stroke="#4c63b6" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Embeddings label -->
  <line x1="411" y1="323" x2="411" y2="380" stroke="#4c63b6" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="346" y="380" width="130" height="28" rx="6" fill="#1a2540" stroke="#4c63b6" stroke-width="1"/>
  <text x="411" y="398" fill="#80a0e0" font-size="10" text-anchor="middle">HF / Ollama / OpenAI</text>

  <!-- Title -->
  <text x="450" y="60" fill="white" font-size="22" font-weight="700" text-anchor="middle">RAG Studio Architecture</text>
  <text x="450" y="86" fill="#888" font-size="13" text-anchor="middle">Multi-query retrieval with contextual compression</text>
  <line x1="80" y1="100" x2="820" y2="100" stroke="#30363d" stroke-width="1"/>

  <!-- Legend -->
  <text x="80" y="148" fill="#888" font-size="11">Pipeline stages:</text>
  <rect x="80" y="158" width="12" height="12" rx="3" fill="#667eea"/>
  <text x="100" y="169" fill="#aaa" font-size="11">Input</text>
  <rect x="160" y="158" width="12" height="12" rx="3" fill="#764ba2"/>
  <text x="180" y="169" fill="#aaa" font-size="11">Retrieval</text>
  <rect x="260" y="158" width="12" height="12" rx="3" fill="#4c63b6"/>
  <text x="280" y="169" fill="#aaa" font-size="11">Vector Search</text>
  <rect x="380" y="158" width="12" height="12" rx="3" fill="#2d3a8c"/>
  <text x="400" y="169" fill="#aaa" font-size="11">Compression</text>
  <rect x="490" y="158" width="12" height="12" rx="3" fill="#1a237e"/>
  <text x="510" y="169" fill="#aaa" font-size="11">Generation</text>

  <!-- Footer -->
  <text x="450" y="470" fill="#555" font-size="11" text-anchor="middle">github.com/punyamodi/rag-studio</text>
</svg>
