<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#f0f2f6"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="750" fill="#ffffff" stroke="#e0e4e8" stroke-width="1"/>
  <rect x="12" y="20" width="196" height="40" rx="8" fill="#667eea"/>
  <text x="30" y="46" fill="white" font-size="15" font-weight="700">RAG Studio</text>
  <text x="30" y="96" fill="#888" font-size="13">Home</text>
  <rect x="12" y="107" width="196" height="36" rx="6" fill="#f0f2ff"/>
  <text x="30" y="130" fill="#667eea" font-size="13" font-weight="600">Documents</text>
  <text x="30" y="166" fill="#888" font-size="13">Chat</text>
  <text x="30" y="200" fill="#888" font-size="13">Settings</text>
  <text x="30" y="234" fill="#888" font-size="13">Analytics</text>

  <!-- Main area -->
  <text x="250" y="44" fill="#1a1a2e" font-size="22" font-weight="700">Document Management</text>
  <text x="250" y="64" fill="#888" font-size="12">Upload, view, and manage documents in the knowledge base</text>
  <line x1="240" y1="78" x2="1180" y2="78" stroke="#e0e4e8" stroke-width="1"/>

  <!-- Tabs -->
  <rect x="248" y="90" width="176" height="36" rx="8" fill="#667eea"/>
  <text x="336" y="113" fill="white" font-size="13" font-weight="600" text-anchor="middle">Upload Documents</text>
  <rect x="432" y="90" width="176" height="36" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="520" y="113" fill="#666" font-size="13" text-anchor="middle">Document Library</text>

  <!-- Upload zone -->
  <rect x="248" y="140" width="680" height="140" rx="12" fill="white" stroke="#667eea" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="588" y="192" fill="#667eea" font-size="14" font-weight="600" text-anchor="middle">Supported formats: PDF, TXT, DOCX, CSV, Markdown</text>
  <text x="588" y="216" fill="#aaa" font-size="13" text-anchor="middle">Drag and drop files here, or click to browse</text>
  <rect x="500" y="238" width="176" height="32" rx="8" fill="#667eea"/>
  <text x="588" y="259" fill="white" font-size="13" font-weight="600" text-anchor="middle">Choose Files</text>

  <!-- Index button -->
  <rect x="248" y="294" width="680" height="36" rx="8" fill="#764ba2"/>
  <text x="588" y="317" fill="white" font-size="13" font-weight="600" text-anchor="middle">Index All Files</text>

  <!-- Success message -->
  <rect x="248" y="342" width="680" height="36" rx="8" fill="#d4edda"/>
  <text x="268" y="365" fill="#155724" font-size="13">Successfully indexed 3 document(s)</text>

  <!-- Indexed results -->
  <!-- Doc card 1 -->
  <rect x="248" y="388" width="680" height="64" rx="10" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="268" y="410" fill="#1a1a2e" font-size="13" font-weight="600">research-paper.pdf</text>
  <text x="268" y="432" fill="#888" font-size="11">ID: a1b2c3d4  |  142 chunks  |  18 pages  |  84,320 characters</text>

  <!-- Doc card 2 -->
  <rect x="248" y="462" width="680" height="64" rx="10" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="268" y="484" fill="#1a1a2e" font-size="13" font-weight="600">meeting-notes.docx</text>
  <text x="268" y="506" fill="#888" font-size="11">ID: e5f6a7b8  |  28 chunks  |  4 pages  |  12,150 characters</text>

  <!-- Doc card 3 -->
  <rect x="248" y="536" width="680" height="64" rx="10" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="268" y="558" fill="#1a1a2e" font-size="13" font-weight="600">financial-report.csv</text>
  <text x="268" y="580" fill="#888" font-size="11">ID: c9d0e1f2  |  64 chunks  |  1 pages  |  31,800 characters</text>

  <!-- Library column (right side) -->
  <text x="962" y="116" fill="#1a1a2e" font-size="14" font-weight="600">Document Library</text>
  <text x="962" y="140" fill="#555" font-size="12">5 documents  |  298 total chunks</text>

  <!-- Library list items -->
  <rect x="958" y="150" width="220" height="44" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="972" y="170" fill="#1a1a2e" font-size="12" font-weight="600">research-paper.pdf</text>
  <text x="972" y="186" fill="#aaa" font-size="10">142 chunks · 18 pages</text>

  <rect x="958" y="202" width="220" height="44" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="972" y="222" fill="#1a1a2e" font-size="12" font-weight="600">meeting-notes.docx</text>
  <text x="972" y="238" fill="#aaa" font-size="10">28 chunks · 4 pages</text>

  <rect x="958" y="254" width="220" height="44" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="972" y="274" fill="#1a1a2e" font-size="12" font-weight="600">financial-report.csv</text>
  <text x="972" y="290" fill="#aaa" font-size="10">64 chunks · 1 pages</text>

  <rect x="958" y="306" width="220" height="44" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="972" y="326" fill="#1a1a2e" font-size="12" font-weight="600">product-spec.md</text>
  <text x="972" y="342" fill="#aaa" font-size="10">38 chunks · 3 pages</text>

  <rect x="958" y="358" width="220" height="44" rx="8" fill="white" stroke="#e0e4e8" stroke-width="1"/>
  <text x="972" y="378" fill="#1a1a2e" font-size="12" font-weight="600">user-manual.txt</text>
  <text x="972" y="394" fill="#aaa" font-size="10">26 chunks · 2 pages</text>
</svg>
