<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#f0f2f6"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="750" fill="#ffffff" stroke="#e0e4e8" stroke-width="1"/>
  <rect x="12" y="14" width="256" height="40" rx="8" fill="#667eea"/>
  <text x="30" y="40" fill="white" font-size="15" font-weight="700">RAG Studio</text>

  <text x="16" y="78" fill="#999" font-size="11" font-weight="600" letter-spacing="1">SESSION SETTINGS</text>

  <text x="16" y="102" fill="#444" font-size="12">Filter by documents</text>
  <rect x="16" y="110" width="248" height="32" rx="6" fill="#f5f7fb" stroke="#dde2ea" stroke-width="1"/>
  <text x="28" y="131" fill="#aaa" font-size="12">All documents selected</text>

  <text x="16" y="168" fill="#999" font-size="11" font-weight="600" letter-spacing="1">RETRIEVAL SETTINGS</text>

  <!-- Toggle: Multi-Query -->
  <rect x="16" y="178" width="248" height="36" rx="6" fill="#fafbfc"/>
  <text x="28" y="201" fill="#444" font-size="12">Multi-Query Expansion</text>
  <rect x="224" y="184" width="36" height="20" rx="10" fill="#667eea"/>
  <circle cx="250" cy="194" r="8" fill="white"/>

  <!-- Toggle: Compression -->
  <rect x="16" y="220" width="248" height="36" rx="6" fill="#fafbfc"/>
  <text x="28" y="243" fill="#444" font-size="12">Contextual Compression</text>
  <rect x="224" y="226" width="36" height="20" rx="10" fill="#667eea"/>
  <circle cx="250" cy="236" r="8" fill="white"/>

  <line x1="16" y1="272" x2="264" y2="272" stroke="#e8ecef" stroke-width="1"/>
  <text x="16" y="296" fill="#999" font-size="11" font-weight="600" letter-spacing="1">SESSION</text>

  <rect x="16" y="304" width="248" height="32" rx="6" fill="#f5f7fb" stroke="#dde2ea" stroke-width="1"/>
  <text x="28" y="325" fill="#444" font-size="12">Research Session</text>

  <rect x="16" y="348" width="248" height="32" rx="6" fill="#667eea"/>
  <text x="140" y="369" fill="white" font-size="13" font-weight="600" text-anchor="middle">Start New Session</text>

  <text x="16" y="400" fill="#aaa" font-size="11">Active: 3f9a2b1c...</text>

  <rect x="16" y="412" width="118" height="28" rx="6" fill="#f5f7fb" stroke="#dde2ea" stroke-width="1"/>
  <text x="75" y="431" fill="#555" font-size="11" text-anchor="middle">Clear History</text>

  <rect x="146" y="412" width="118" height="28" rx="6" fill="#fff0f0" stroke="#ffcccc" stroke-width="1"/>
  <text x="205" y="431" fill="#c00" font-size="11" text-anchor="middle">End Session</text>

  <!-- Main area -->
  <text x="304" y="44" fill="#1a1a2e" font-size="22" font-weight="700">Chat with Documents</text>
  <line x1="295" y1="60" x2="1188" y2="60" stroke="#e0e4e8" stroke-width="1"/>

  <text x="304" y="86" fill="#888" font-size="13" font-weight="600">Conversation</text>

  <!-- User message 1 -->
  <rect x="700" y="98" width="460" height="52" rx="14" fill="url(#userBubble)"/>
  <text x="928" y="118" fill="white" font-size="13" text-anchor="middle">What is retrieval-augmented generation?</text>
  <text x="928" y="136" fill="#c8d4ff" font-size="11" text-anchor="middle">— user</text>

  <!-- Assistant message 1 -->
  <rect x="304" y="168" width="580" height="104" rx="14" fill="#eef0f6"/>
  <text x="320" y="191" fill="#1a1a2e" font-size="13">Retrieval-Augmented Generation (RAG) is a technique that</text>
  <text x="320" y="210" fill="#1a1a2e" font-size="13">combines a retrieval system with a language model. Instead of</text>
  <text x="320" y="229" fill="#1a1a2e" font-size="13">relying solely on parametric knowledge, the model first</text>
  <text x="320" y="248" fill="#1a1a2e" font-size="13">retrieves relevant context from a document corpus...</text>
  <rect x="320" y="258" width="96" height="18" rx="9" fill="#e0e6f8"/>
  <text x="368" y="271" fill="#4a5568" font-size="10" text-anchor="middle">rag-overview.pdf</text>
  <rect x="424" y="258" width="80" height="18" rx="9" fill="#e0e6f8"/>
  <text x="464" y="271" fill="#4a5568" font-size="10" text-anchor="middle">notes.txt</text>

  <!-- User message 2 -->
  <rect x="660" y="292" width="500" height="52" rx="14" fill="url(#userBubble)"/>
  <text x="908" y="312" fill="white" font-size="13" text-anchor="middle">How does FAISS improve search performance?</text>
  <text x="908" y="330" fill="#c8d4ff" font-size="11" text-anchor="middle">— user</text>

  <!-- Assistant message 2 -->
  <rect x="304" y="362" width="580" height="120" rx="14" fill="#eef0f6"/>
  <text x="320" y="385" fill="#1a1a2e" font-size="13">FAISS (Facebook AI Similarity Search) uses approximate</text>
  <text x="320" y="404" fill="#1a1a2e" font-size="13">nearest-neighbor algorithms like IVF and HNSW to search</text>
  <text x="320" y="423" fill="#1a1a2e" font-size="13">billions of vectors in milliseconds. It compresses vectors</text>
  <text x="320" y="442" fill="#1a1a2e" font-size="13">via product quantization, cutting memory use by 8-32x...</text>
  <rect x="320" y="456" width="88" height="18" rx="9" fill="#e0e6f8"/>
  <text x="364" y="469" fill="#4a5568" font-size="10" text-anchor="middle">faiss-paper.pdf</text>
  <text x="430" y="469" fill="#aaa" font-size="10">1240ms</text>

  <!-- User message 3 -->
  <rect x="760" y="502" width="400" height="40" rx="14" fill="url(#userBubble)"/>
  <text x="958" y="527" fill="white" font-size="13" text-anchor="middle">What models work best with RAG?</text>

  <!-- Typing indicator -->
  <rect x="304" y="556" width="100" height="36" rx="14" fill="#eef0f6"/>
  <circle cx="328" cy="574" r="5" fill="#aaa">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="348" cy="574" r="5" fill="#aaa">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="368" cy="574" r="5" fill="#aaa">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>

  <line x1="295" y1="610" x2="1188" y2="610" stroke="#e0e4e8" stroke-width="1"/>

  <!-- Input area -->
  <rect x="304" y="624" width="780" height="60" rx="10" fill="white" stroke="#d0d8ea" stroke-width="1.5"/>
  <text x="322" y="659" fill="#bbb" font-size="13">Ask a question about your documents...</text>

  <rect x="1096" y="624" width="90" height="60" rx="10" fill="#667eea"/>
  <text x="1141" y="659" fill="white" font-size="14" font-weight="600" text-anchor="middle">Send</text>

  <defs>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
</svg>
