<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#f0f2f6"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="750" fill="#ffffff" stroke="#e0e4e8" stroke-width="1"/>
  <rect x="12" y="20" width="196" height="40" rx="8" fill="#667eea"/>
  <text x="30" y="46" fill="white" font-size="15" font-weight="700">RAG Studio</text>

  <!-- Nav items -->
  <rect x="12" y="75" width="196" height="36" rx="6" fill="#f0f2ff"/>
  <text x="30" y="98" fill="#667eea" font-size="13" font-weight="600">Home</text>

  <text x="30" y="136" fill="#888" font-size="13">Documents</text>
  <text x="30" y="170" fill="#888" font-size="13">Chat</text>
  <text x="30" y="204" fill="#888" font-size="13">Settings</text>
  <text x="30" y="238" fill="#888" font-size="13">Analytics</text>

  <!-- Main content area -->
  <!-- Header -->
  <text x="250" y="58" fill="#2d2d5e" font-size="28" font-weight="700">RAG Studio</text>
  <text x="250" y="82" fill="#666" font-size="13">Intelligent document Q&amp;A powered by FAISS vector search and LLMs</text>
  <line x1="240" y1="96" x2="1180" y2="96" stroke="#e0e4e8" stroke-width="1"/>

  <!-- Metric cards row -->
  <!-- Card 1 -->
  <rect x="248" y="112" width="200" height="90" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <rect x="248" y="112" width="200" height="90" rx="12" fill="url(#cardGrad)"/>
  <text x="348" y="155" fill="#667eea" font-size="28" font-weight="700" text-anchor="middle">5</text>
  <text x="348" y="178" fill="#666" font-size="12" text-anchor="middle">Documents Indexed</text>

  <!-- Card 2 -->
  <rect x="468" y="112" width="200" height="90" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <rect x="468" y="112" width="200" height="90" rx="12" fill="url(#cardGrad)"/>
  <text x="568" y="155" fill="#667eea" font-size="28" font-weight="700" text-anchor="middle">3</text>
  <text x="568" y="178" fill="#666" font-size="12" text-anchor="middle">Chat Sessions</text>

  <!-- Card 3 -->
  <rect x="688" y="112" width="200" height="90" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <rect x="688" y="112" width="200" height="90" rx="12" fill="url(#cardGrad)"/>
  <text x="788" y="155" fill="#667eea" font-size="28" font-weight="700" text-anchor="middle">OLLAMA</text>
  <text x="788" y="178" fill="#666" font-size="12" text-anchor="middle">LLM Provider</text>

  <!-- Card 4 -->
  <rect x="908" y="112" width="200" height="90" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <rect x="908" y="112" width="200" height="90" rx="12" fill="url(#cardGrad)"/>
  <text x="1008" y="155" fill="#667eea" font-size="22" font-weight="700" text-anchor="middle">HF</text>
  <text x="1008" y="178" fill="#666" font-size="12" text-anchor="middle">Embedding Model</text>

  <!-- Status bar -->
  <rect x="248" y="218" width="860" height="36" rx="8" fill="#d4edda"/>
  <text x="268" y="241" fill="#155724" font-size="13">Ollama connected  |  Available models: mistral:7b, llama3:8b, phi3:mini</text>

  <line x1="240" y1="272" x2="1180" y2="272" stroke="#e0e4e8" stroke-width="1"/>

  <!-- How it works -->
  <text x="248" y="302" fill="#1a1a2e" font-size="18" font-weight="600">How it works</text>

  <!-- Feature card 1 -->
  <rect x="248" y="320" width="270" height="140" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <text x="268" y="348" fill="#1a1a2e" font-size="14" font-weight="600">1. Upload Documents</text>
  <foreignObject x="268" y="356" width="230" height="84">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="font-size:12px;color:#555;line-height:1.5;margin:0">Upload PDFs, Word docs, text files, CSVs, or Markdown. System chunks and indexes them into FAISS.</p>
    </body>
  </foreignObject>

  <!-- Feature card 2 -->
  <rect x="538" y="320" width="270" height="140" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <text x="558" y="348" fill="#1a1a2e" font-size="14" font-weight="600">2. Ask Questions</text>
  <foreignObject x="558" y="356" width="230" height="84">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="font-size:12px;color:#555;line-height:1.5;margin:0">Ask natural language questions. Multi-query retriever generates multiple variants to maximize recall.</p>
    </body>
  </foreignObject>

  <!-- Feature card 3 -->
  <rect x="828" y="320" width="270" height="140" rx="12" fill="white" stroke="#e8ecef" stroke-width="1"/>
  <text x="848" y="348" fill="#1a1a2e" font-size="14" font-weight="600">3. Get Answers with Sources</text>
  <foreignObject x="848" y="356" width="230" height="84">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p style="font-size:12px;color:#555;line-height:1.5;margin:0">Receive grounded answers with source citations. Contextual compression filters noise.</p>
    </body>
  </foreignObject>

  <line x1="240" y1="480" x2="1180" y2="480" stroke="#e0e4e8" stroke-width="1"/>

  <!-- Architecture section -->
  <text x="248" y="510" fill="#1a1a2e" font-size="18" font-weight="600">Architecture</text>

  <!-- Pipeline boxes -->
  <rect x="260" y="528" width="148" height="44" rx="8" fill="#667eea"/>
  <text x="334" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">User Query</text>
  <text x="334" y="560" fill="#d0d8ff" font-size="10" text-anchor="middle">natural language</text>
  <polygon points="412,550 428,543 428,557" fill="#667eea"/>

  <rect x="434" y="528" width="148" height="44" rx="8" fill="#764ba2"/>
  <text x="508" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">Multi-Query</text>
  <text x="508" y="560" fill="#e0c8ff" font-size="10" text-anchor="middle">5 variants</text>
  <polygon points="586,550 602,543 602,557" fill="#764ba2"/>

  <rect x="608" y="528" width="148" height="44" rx="8" fill="#4c63b6"/>
  <text x="682" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">FAISS Search</text>
  <text x="682" y="560" fill="#b0c0ff" font-size="10" text-anchor="middle">vector similarity</text>
  <polygon points="760,550 776,543 776,557" fill="#4c63b6"/>

  <rect x="782" y="528" width="148" height="44" rx="8" fill="#2d3a8c"/>
  <text x="856" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">Compression</text>
  <text x="856" y="560" fill="#a0b0ff" font-size="10" text-anchor="middle">filter noise</text>
  <polygon points="934,550 950,543 950,557" fill="#2d3a8c"/>

  <rect x="956" y="528" width="148" height="44" rx="8" fill="#1a237e"/>
  <text x="1030" y="545" fill="white" font-size="11" font-weight="600" text-anchor="middle">RAG Chain</text>
  <text x="1030" y="560" fill="#90a0ff" font-size="10" text-anchor="middle">generate answer</text>

  <text x="248" y="630" fill="#aaa" font-size="12">RAG Studio v2.0.0  |  Navigate using the sidebar</text>

  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c3cfe2;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
</svg>
